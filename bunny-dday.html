*{box-sizing:border-box}
body{margin:0;padding:12px;color:#4a3030;background:#fff;font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.card{max-width:640px;margin:auto;border:1px solid #eddbd2;border-radius:25px;background:radial-gradient(ellipse at 86% 50%,#f8dbdf 0,transparent 44%),linear-gradient(120deg,#fffaf1,#fff5ee);box-shadow:0 5px 14px #62433b10;padding:clamp(18px,5vw,33px)}
.top{display:grid;grid-template-columns:minmax(0,1fr) minmax(118px,60%);gap:10px;align-items:center;min-height:150px}
h1{margin:0 0 9px;font-size:clamp(15px,3.9vw,22px);font-family:"Jua",system-ui,sans-serif;font-weight:400;line-height:1.4;word-break:keep-all}
p{margin:0}
.count{font-family:"Jua",ui-rounded,system-ui,sans-serif;font-size:clamp(32px,9.6vw,64px);font-weight:400;letter-spacing:-.025em;line-height:1.12;margin-bottom:7px}
.week{margin-top:4px;font-size:12px;color:#714f4d}
.caption{font-family:"Jua",system-ui,sans-serif;font-size:clamp(12px,3.2vw,15px);line-height:1.5;color:#714f4d}
.rabbit{width:100%;max-width:384px;justify-self:center;height:auto;filter:drop-shadow(0 8px 8px #a25f5626)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}
button,input{font:inherit;border-radius:10px;min-height:42px}
button{font-family:"Jua",system-ui,sans-serif;padding:7px 13px;border:1px solid #d8afaa;color:#633d3c;background:#fff9f4;font-size:14px;font-weight:400;cursor:pointer}

    <label for="due">출산 예정일</label>
    <input type="date" id="due" required min="1900-01-01" max="9999-12-31">
    <div class="actions"><button class="primary" type="submit">저장</button><button type="button" id="cancel">취소</button></div>

  <details id="sharing" hidden>
    <summary>예정일 고정 링크</summary>
    <p>링크에 예정일이 포함돼요. 다른 기기에서도 같은 날짜를 보려면 내 노션 복제본의 임베드 주소를 이 링크로 바꿔주세요.</p>
    <input id="fixed" aria-label="예정일이 포함된 링크" readonly>
    <div class="actions"><button type="button" id="copy">링크 복사</button></div>
  </details>
  <p id="message" role="status"></p>
</main>
<script>
const storageKey = 'dday-calculator:due';
const byId = id => document.getElementById(id);
const editor = byId('editor');
const field = byId('due');
const edit = byId('edit');
const message = byId('message');
let due = '';

function parseDate(value) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(value) || value < '1900-01-01') return null;
  const date = new Date(value + 'T00:00:00Z');
  return Number.isFinite(+date) && date.toISOString().slice(0, 10) === value ? date : null;
}

function render() {
  const date = parseDate(due);
  if (!date) return;
  const now = new Date();
  const today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  const days = (+date - today) / 86400000;
  byId('count').textContent = days === 0 ? 'D-Day' : 'D' + (days > 0 ? '−' : '+') + Math.abs(days);
  byId('count').hidden = false;
  const formatted = new Intl.DateTimeFormat('ko-KR', {
    year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC'
  }).format(date);
  byId('caption').textContent = (days === 0 ? '오늘이 예정일이에요 · ' : '출산 예정일 · ') + formatted;
  const elapsed = 280 - days;
  const week = byId('week');
  week.hidden = elapsed < 0 || days < 0;
  if (!week.hidden) week.textContent = '예정일 기준 ' + Math.floor(elapsed / 7) + '주 ' + (elapsed % 7) + '일';
  edit.textContent = '예정일 변경';
  const link = new URL(location.href);
  link.search = '';
  link.hash = '';
  link.searchParams.set('due', due);
  byId('fixed').value = link.href;
  byId('sharing').hidden = false;
}

function showEditor(open) {
  editor.hidden = !open;
  edit.setAttribute('aria-expanded', String(open));
  if (open) {
    field.value = due;
    field.focus();
  } else {
    edit.focus();
  }
}

edit.addEventListener('click', () => showEditor(editor.hidden));
byId('cancel').addEventListener('click', () => showEditor(false));

editor.addEventListener('submit', event => {
  event.preventDefault();
  if (!parseDate(field.value)) return;
  due = field.value;
  let saved = false;
  try {
    localStorage.setItem(storageKey, due);
    saved = true;
  } catch {}
  const url = new URL(location.href);
  const pinned = url.searchParams.has('due');
  if (pinned) {
    url.searchParams.set('due', due);
    try { history.replaceState(null, '', url); } catch {}
  }
  render();
  showEditor(false);
  message.textContent = pinned
    ? '노션에 고정한 날짜를 바꾸려면 새 링크를 복사해 임베드 주소를 바꿔주세요.'
    : saved ? '이 브라우저에 예정일을 저장했어요.' : '이 환경에서는 날짜를 자동 저장할 수 없어요. 예정일 고정 링크를 사용해 주세요.';
});

byId('copy').addEventListener('click', async () => {
  const link = byId('fixed');
  try {
    await navigator.clipboard.writeText(link.value);
    message.textContent = '링크를 복사했어요.';
  } catch {
    link.focus();
    link.select();
    message.textContent = '선택된 링크를 복사해 주세요.';
  }
});

const pinnedDate = new URLSearchParams(location.search).get('due') || '';
if (parseDate(pinnedDate)) {
  due = pinnedDate;
} else {
  try { due = localStorage.getItem(storageKey) || ''; } catch {}
}
render();
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
setInterval(render, 60000);
</script>
</html>
