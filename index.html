<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤰 출산 D-day 계산기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
    background: linear-gradient(135deg, #fff0f5 0%, #ffe4f0 100%);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 1.25rem;
  }

  .wrap {
    width: 100%;
    max-width: 860px;
  }

  /* ── 입력 섹션 (가로형) ── */
  .input-section {
    background: rgba(255,255,255,0.88);
    border-radius: 20px;
    padding: 1.5rem 2rem;
    box-shadow: 0 4px 24px rgba(220,80,140,0.10);
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .input-title { flex: 0 0 auto; }
  .input-title h1 { font-size: 17px; font-weight: 700; color: #5a1a3a; white-space: nowrap; }
  .input-title p  { font-size: 12px; color: #c088a8; white-space: nowrap; }
  .row { display: flex; gap: 10px; flex: 1; min-width: 260px; }
  input[type="date"] {
    flex: 1;
    padding: 11px 14px;
    border: 2px solid #f0c0d8;
    border-radius: 12px;
    font-size: 15px;
    color: #5a1a3a;
    background: #fff8fb;
    outline: none;
  }
  input[type="date"]:focus { border-color: #e05090; }
  .btn {
    padding: 11px 22px;
    background: linear-gradient(135deg, #f06090, #e0307a);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:active { opacity: 0.88; }
  .err { font-size: 13px; color: #e05555; margin-top: 6px; display: none; width: 100%; }

  /* ── 결과 가로 레이아웃 ── */
  .result-row {
    display: none;
    gap: 1rem;
    align-items: stretch;
  }

  /* D-day 빅 카드 */
  .dday-card {
    background: linear-gradient(135deg, #f06090, #c0306a);
    border-radius: 20px;
    padding: 1.75rem 1.5rem;
    box-shadow: 0 6px 32px rgba(200,50,100,0.22);
    flex: 0 0 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    animation: pop 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes pop { from { opacity:0; transform:scale(0.88); } to { opacity:1; transform:scale(1); } }
  .dday-label { font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.75); letter-spacing: 2px; margin-bottom: 6px; }
  .dday-num   { font-size: clamp(36px, 6vw, 56px); font-weight: 800; color: #fff; line-height: 1; letter-spacing: -1px; margin-bottom: 6px; }
  .dday-sub   { font-size: 12px; color: rgba(255,255,255,0.8); line-height: 1.5; }

  /* 오른쪽 정보 패널 */
  .info-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  /* 메트릭 그리드 */
  .metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.75rem;
  }
  .metric {
    background: rgba(255,255,255,0.88);
    border-radius: 14px;
    padding: 0.9rem 0.5rem;
    text-align: center;
    box-shadow: 0 2px 10px rgba(200,80,120,0.08);
  }
  .metric-lbl { font-size: 11px; font-weight: 600; color: #c088a8; letter-spacing: 0.4px; margin-bottom: 4px; }
  .metric-val { font-size: 17px; font-weight: 700; color: #5a1a3a; }

  /* 진행 바 */
  .prog-card {
    background: rgba(255,255,255,0.88);
    border-radius: 14px;
    padding: 1rem 1.25rem;
    box-shadow: 0 2px 10px rgba(200,80,120,0.08);
  }
  .prog-header { display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; color: #c088a8; margin-bottom: 8px; }
  .prog-track  { background: #f5d0e0; border-radius: 999px; height: 10px; overflow: hidden; margin-bottom: 6px; }
  .prog-fill   { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #f06090, #e0307a); transition: width 0.8s cubic-bezier(0.4,0,0.2,1); }
  .prog-pct    { font-size: 12px; font-weight: 700; color: #e0307a; text-align: right; }

  /* 메시지 */
  .msg-card {
    background: rgba(255,255,255,0.88);
    border-radius: 14px;
    padding: 0.9rem 1.25rem;
    font-size: 14px;
    color: #7a3a5a;
    font-weight: 500;
    box-shadow: 0 2px 10px rgba(200,80,120,0.08);
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="wrap">
  <!-- 입력 -->
  <div class="input-section">
    <div class="input-title">
      <h1>🤰 출산 D-day 계산기</h1>
      <p>출산 예정일을 입력하세요</p>
    </div>
    <div class="row">
      <input type="date" id="due" />
      <button class="btn" onclick="calc()">계산</button>
    </div>
    <p class="err" id="err">날짜를 먼저 입력해주세요!</p>
  </div>

  <!-- 결과 (가로) -->
  <div class="result-row" id="result-row">
    <div class="dday-card">
      <div class="dday-label">D - DAY</div>
      <div class="dday-num" id="dday-num"></div>
      <div class="dday-sub" id="dday-sub"></div>
    </div>
    <div class="info-panel">
      <div class="metrics">
        <div class="metric">
          <div class="metric-lbl">출산 예정일</div>
          <div class="metric-val" id="due-val"></div>
        </div>
        <div class="metric">
          <div class="metric-lbl">임신 주수</div>
          <div class="metric-val" id="week-val"></div>
        </div>
        <div class="metric">
          <div class="metric-lbl">남은 날</div>
          <div class="metric-val" id="days-val"></div>
        </div>
      </div>
      <div class="prog-card">
        <div class="prog-header"><span>🌱 임신 시작</span><span>🏥 출산 예정일</span></div>
        <div class="prog-track"><div class="prog-fill" id="bar" style="width:0%"></div></div>
        <div class="prog-pct" id="pct-val"></div>
      </div>
      <div class="msg-card" id="msg-card"></div>
    </div>
  </div>
</div>

<script>
function calc() {
  const v = document.getElementById('due').value;
  const err = document.getElementById('err');
  if (!v) { err.style.display = 'block'; return; }
  err.style.display = 'none';

  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(v); due.setHours(0,0,0,0);
  const diff = Math.round((due - today) / 86400000);

  const start = new Date(due); start.setDate(start.getDate() - 280);
  const elapsed = Math.round((today - start) / 86400000);
  const pct = Math.min(Math.max((elapsed / 280) * 100, 0), 100);
  const weeks = Math.floor(Math.max(elapsed,0) / 7);
  const days  = Math.max(elapsed,0) % 7;

  const numEl = document.getElementById('dday-num');
  if (diff > 0)       numEl.textContent = `D-${diff}`;
  else if (diff === 0) numEl.textContent = `D-Day!`;
  else                numEl.textContent = `D+${Math.abs(diff)}`;

  const d = due;
  document.getElementById('dday-sub').textContent = `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;
  document.getElementById('due-val').textContent  = `${d.getMonth()+1}월 ${d.getDate()}일`;
  document.getElementById('week-val').textContent = elapsed>0&&diff>=0 ? `${weeks}주 ${days}일` : diff<0 ? '출산 완료' : '-';
  document.getElementById('days-val').textContent = diff>0 ? `${diff}일` : diff===0 ? '오늘!' : `+${Math.abs(diff)}일`;
  document.getElementById('bar').style.width = `${pct.toFixed(1)}%`;
  document.getElementById('pct-val').textContent = `진행률 ${Math.round(pct)}%`;

  let msg = '';
  if (diff > 90)      msg = '💕 소중한 아기와의 만남을 기다리고 있어요. 건강하게 잘 지내세요!';
  else if (diff > 30) msg = '🌸 임신 후기예요! 태동을 꼼꼼히 체크하고 정기 검진 빠짐없이 받으세요.';
  else if (diff > 14) msg = '🎒 출산이 한 달 이내예요! 출산 가방 최종 점검해보세요.';
  else if (diff > 0)  msg = '🤱 이제 곧 만나요! 언제든 분만이 시작될 수 있으니 준비 완료 상태로 있어요.';
  else if (diff === 0) msg = '🌺 오늘이 출산 예정일이에요! 건강하고 순산하길 응원해요!';
  else                msg = '👶 출산 예정일이 지났어요. 아기와 산모 모두 건강하길 바라요!';

  document.getElementById('msg-card').textContent = msg;
  document.getElementById('result-row').style.display = 'flex';
}
</script>
</body>
</html>
