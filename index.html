<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤰 출산 D-day 계산기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
    background: linear-gradient(135deg, #fff0f5 0%, #f0ebff 100%);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 1rem;
  }

  .wrap {
    width: 100%;
    max-width: 680px;
    text-align: center;
  }

  /* ── 입력 섹션 ── */
  .input-section {
    background: rgba(255,255,255,0.85);
    border-radius: 20px;
    padding: 2rem 2rem 1.75rem;
    box-shadow: 0 4px 32px rgba(160,80,200,0.10);
    margin-bottom: 1.25rem;
  }
  .input-section h1 {
    font-size: 20px;
    font-weight: 700;
    color: #3a1a5a;
    margin-bottom: 4px;
  }
  .input-section p {
    font-size: 14px;
    color: #9a7aaa;
    margin-bottom: 1.25rem;
  }
  .row {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  input[type="date"] {
    flex: 1;
    padding: 13px 16px;
    border: 2px solid #e0d0f0;
    border-radius: 12px;
    font-size: 15px;
    color: #3a1a5a;
    background: #fdf8ff;
    outline: none;
  }
  input[type="date"]:focus { border-color: #a060d0; }
  .btn {
    padding: 13px 22px;
    background: linear-gradient(135deg, #c47ee0, #8b5cf6);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:active { opacity: 0.88; }
  .err { font-size: 13px; color: #e05555; margin-top: 8px; display: none; }

  /* ── D-day 빅 카드 ── */
  .dday-card {
    display: none;
    background: linear-gradient(135deg, #8b3cbb, #5b21b6);
    border-radius: 24px;
    padding: 2.5rem 2rem;
    box-shadow: 0 8px 40px rgba(100,40,180,0.25);
    margin-bottom: 1.25rem;
    animation: pop 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes pop { from { opacity:0; transform:scale(0.88); } to { opacity:1; transform:scale(1); } }

  .dday-label { font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.75); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
  .dday-num { font-size: clamp(40px, 10vw, 60px); font-weight: 800; color: #fff; line-height: 1; letter-spacing: -2px; margin-bottom: 10px; }
  .dday-sub { font-size: 16px; color: rgba(255,255,255,0.8); margin-bottom: 1.5rem; }

  /* 진행 바 */
  .prog-wrap { background: rgba(255,255,255,0.18); border-radius: 999px; height: 10px; margin: 0 auto 8px; max-width: 400px; overflow: hidden; }
  .prog-fill { height: 100%; border-radius: 999px; background: rgba(255,255,255,0.9); transition: width 0.8s cubic-bezier(0.4,0,0.2,1); }
  .prog-label { font-size: 13px; color: rgba(255,255,255,0.65); }

  /* ── 작은 메트릭 그리드 ── */
  .metrics {
    display: none;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 1.25rem;
  }
  .metric {
    background: rgba(255,255,255,0.85);
    border-radius: 14px;
    padding: 1rem 0.5rem;
    box-shadow: 0 2px 12px rgba(160,80,200,0.08);
  }
  .metric-lbl { font-size: 11px; font-weight: 600; color: #9a7aaa; letter-spacing: 0.5px; margin-bottom: 5px; }
  .metric-val { font-size: 18px; font-weight: 700; color: #3a1a5a; }

  /* ── 메시지 ── */
  .msg-card {
    display: none;
    background: rgba(255,255,255,0.85);
    border-radius: 14px;
    padding: 1rem 1.25rem;
    font-size: 15px;
    color: #5a3a7a;
    font-weight: 500;
    box-shadow: 0 2px 12px rgba(160,80,200,0.08);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="input-section">
    <h1>🤰 출산 D-day 계산기</h1>
    <p>출산 예정일을 입력하세요</p>
    <div class="row">
      <input type="date" id="due" />
      <button class="btn" onclick="calc()">계산</button>
    </div>
    <p class="err" id="err">날짜를 먼저 입력해주세요!</p>
  </div>

  <div class="dday-card" id="dday-card">
    <div class="dday-label">D - DAY</div>
    <div class="dday-num" id="dday-num"></div>
    <div class="dday-sub" id="dday-sub"></div>
    <div class="prog-wrap">
      <div class="prog-fill" id="bar" style="width:0%"></div>
    </div>
    <div class="prog-label" id="prog-label"></div>
  </div>

  <div class="metrics" id="metrics" style="display:none">
    <div class="metric">
      <div class="metric-lbl">출산 예정일</div>
      <div class="metric-val" id="due-val"></div>
    </div>
    <div class="metric">
      <div class="metric-lbl">임신 주수</div>
      <div class="metric-val" id="week-val"></div>
    </div>
    <div class="metric">
      <div class="metric-lbl">남은 날</div>
      <div class="metric-val" id="days-val"></div>
    </div>
  </div>

  <div class="msg-card" id="msg-card"></div>
</div>

<script>
function calc() {
  const v = document.getElementById('due').value;
  const err = document.getElementById('err');
  if (!v) { err.style.display = 'block'; return; }
  err.style.display = 'none';

  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(v); due.setHours(0,0,0,0);
  const diff = Math.round((due - today) / 86400000);

  const start = new Date(due); start.setDate(start.getDate() - 280);
  const elapsed = Math.round((today - start) / 86400000);
  const pct = Math.min(Math.max((elapsed / 280) * 100, 0), 100);
  const weeks = Math.floor(Math.max(elapsed,0) / 7);
  const days  = Math.max(elapsed,0) % 7;

  // 빅 D-day
  const numEl = document.getElementById('dday-num');
  if (diff > 0)      numEl.textContent = `D-${diff}`;
  else if (diff===0) numEl.textContent = `D-Day!`;
  else               numEl.textContent = `D+${Math.abs(diff)}`;

  const d = due;
  document.getElementById('dday-sub').textContent = `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일이 출산 예정일이에요`;
  document.getElementById('bar').style.width = `${pct.toFixed(1)}%`;
  document.getElementById('prog-label').textContent = `임신 진행률 ${Math.round(pct)}%`;

  // 메트릭
  document.getElementById('due-val').textContent = `${d.getMonth()+1}월 ${d.getDate()}일`;
  document.getElementById('week-val').textContent = elapsed>0&&diff>=0 ? `${weeks}주 ${days}일` : diff<0 ? '출산 완료' : '-';
  document.getElementById('days-val').textContent = diff>0 ? `${diff}일` : diff===0 ? '오늘!' : `+${Math.abs(diff)}일`;

  // 메시지
  let msg = '';
  if (diff > 90)     msg = '💕 소중한 아기와의 만남을 기다리고 있어요. 건강하게 잘 지내세요!';
  else if (diff > 30) msg = '🌸 임신 후기예요! 태동을 꼼꼼히 체크하고 정기 검진 빠짐없이 받으세요.';
  else if (diff > 14) msg = '🎒 출산이 한 달 이내예요! 출산 가방 최종 점검해보세요.';
  else if (diff > 0)  msg = '🤱 이제 곧 만나요! 언제든 분만이 시작될 수 있으니 준비 완료 상태로 있어요.';
  else if (diff===0)  msg = '🌺 오늘이 출산 예정일이에요! 건강하고 순산하길 응원해요!';
  else                msg = '👶 출산 예정일이 지났어요. 아기와 산모 모두 건강하길 바라요!';

  document.getElementById('msg-card').textContent = msg;

  document.getElementById('dday-card').style.display = 'block';
  document.getElementById('metrics').style.display = 'grid';
  document.getElementById('msg-card').style.display = 'block';
}
</script>
</body>
</html>
